[package]
name = "cmd-helper"
version = "0.3.0"
edition = "2024"
description = "AI-powered command-line helper using Ollama"
license = "MIT"
authors = ["skint007"]

[dependencies]
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", features = ["stream", "rustls-tls", "json"], default-features = false }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
rusqlite = { version = "0.32", features = ["bundled"] }
crossterm = "0.28"
indicatif = "0.17"
arboard = "3"
dirs = "6"
regex = "1"
chrono = "0.4"
futures-util = "0.3"
